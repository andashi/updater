name: release

# A release is a tag `v*`. CI builds the UNSIGNED release APK twice, on two
# independent runners, and refuses the release if the two differ: that is
# the reproducibility gate of decision 0003. The owner then rebuilds
# locally, compares against the artifact's hash, and signs offline. No key
# ever enters this workflow, and nothing here can produce a signed APK.
#
# What CI publishes: the unsigned APK, its SHA-256, and the tool versions
# that built it, as a draft release. The owner attaches the signed APK and
# publishes. The lock refresh in andashi/provisioning picks the signed
# asset up by its digest, as for every other app.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Read by default; only the job that opens the draft release may write.
permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/verify.yml

  build:
    needs: tests
    permissions:
      contents: read
    strategy:
      matrix:
        runner: [a, b]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Unsigned release build
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Hash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk "out/updater-unsigned-${{ matrix.runner }}.apk"
          sha256sum "out/updater-unsigned-${{ matrix.runner }}.apk" | tee "out/updater-unsigned-${{ matrix.runner }}.sha256"
          { echo "jdk: $(java -version 2>&1 | head -1)"; echo "gradle: $(./gradlew --version -q | grep -E '^Gradle' )"; cat gradle/libs.versions.toml; } > "out/toolchain-${{ matrix.runner }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.runner }}
          path: out

  compare:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: builds
      - name: Two runners, one APK
        run: |
          set -euo pipefail
          a="$(cut -d' ' -f1 builds/build-a/updater-unsigned-a.sha256)"
          b="$(cut -d' ' -f1 builds/build-b/updater-unsigned-b.sha256)"
          echo "runner a: $a"
          echo "runner b: $b"
          [ "$a" = "$b" ] || { echo "::error::the two builds differ - not reproducible, no release"; exit 1; }
          mkdir -p release
          cp builds/build-a/updater-unsigned-a.apk release/updater-unsigned.apk
          echo "$a  updater-unsigned.apk" > release/SHA256SUMS
          cp builds/build-a/toolchain-a.txt release/toolchain.txt
      - name: Draft release with the unsigned artifact
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "$tag" \
            --notes "Unsigned, reproducible on two runners. The owner rebuilds, compares with SHA256SUMS, signs offline and attaches the signed APK before publishing (docs/release.md)." \
            release/updater-unsigned.apk release/SHA256SUMS release/toolchain.txt
