name: release

# A release is a tag `v*`. CI builds the UNSIGNED release APK twice, on two
# independent runners, and refuses to go on if the two differ: that is the
# reproducibility gate of decision 0004. The signing job then runs in the
# GitHub Environment `release`, whose only required reviewer is the owner:
# the key is handed to that job only after the owner's Approve tap, which
# is the one human look at an updater release. Nothing outside that job
# can read the key, and the job signs only the artifact the two builds
# agreed on.
#
# What is published: the signed APK, the unsigned APK it was made from,
# both hashes, the signer's fingerprint and the tool versions. The lock
# refresh in andashi/provisioning picks the signed asset up by its digest,
# as for every other app.
#
# Every action is pinned to a commit: a mutable tag could point at other
# code on a later run, and the signing job has the key.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Read by default; only the signing job may write the release.
permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/verify.yml

  build:
    needs: tests
    permissions:
      contents: read
    strategy:
      matrix:
        runner: [a, b]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Unsigned release build
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Hash
        env:
          RUNNER_TAG: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk "out/updater-unsigned-$RUNNER_TAG.apk"
          sha256sum "out/updater-unsigned-$RUNNER_TAG.apk" | tee "out/updater-unsigned-$RUNNER_TAG.sha256"
          { echo "jdk: $(java -version 2>&1 | head -1)"; echo "gradle: $(./gradlew --version -q | grep -E '^Gradle')"; cat gradle/libs.versions.toml; } > "out/toolchain-$RUNNER_TAG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.runner }}
          path: out

  compare:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: builds
      - name: Two runners, one APK
        run: |
          set -euo pipefail
          a="$(cut -d' ' -f1 builds/build-a/updater-unsigned-a.sha256)"
          b="$(cut -d' ' -f1 builds/build-b/updater-unsigned-b.sha256)"
          echo "runner a: $a"
          echo "runner b: $b"
          [ "$a" = "$b" ] || { echo "::error::the two builds differ - not reproducible, no release"; exit 1; }
          mkdir -p agreed
          cp builds/build-a/updater-unsigned-a.apk agreed/updater-unsigned.apk
          echo "$a  updater-unsigned.apk" > agreed/SHA256SUMS
          cp builds/build-a/toolchain-a.txt agreed/toolchain.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agreed
          path: agreed

  sign:
    needs: compare
    if: startsWith(github.ref, 'refs/tags/')
    # The environment holds the key and requires the owner's approval; this
    # job waits for the tap and only then receives the secrets.
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agreed
          path: agreed
      - name: The artifact is the one the runners agreed on
        run: |
          set -euo pipefail
          cd agreed
          sha256sum -c SHA256SUMS
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::no key in the release environment (docs/release.md)"; exit 1; }
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          ks="$RUNNER_TEMP/release.p12"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          mkdir -p release
          cp agreed/updater-unsigned.apk release/
          "$bt/apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out "release/updater-$TAG.apk" agreed/updater-unsigned.apk
          rm -f "$ks"
          "$bt/apksigner" verify --print-certs "release/updater-$TAG.apk" | tee release/certs.txt
          fp="$(sed -n 's/.*SHA-256 digest: //p' release/certs.txt | head -1 | tr 'A-F' 'a-f')"
          echo "$fp" > release/signer.sha256
          cp agreed/toolchain.txt release/
          ( cd release && sha256sum "updater-$TAG.apk" updater-unsigned.apk > SHA256SUMS )
          cat release/SHA256SUMS
          echo "signer sha256: $fp"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          fp="$(cat release/signer.sha256)"
          notes="Built twice on independent runners and signed only because both builds agreed (SHA256SUMS names both the signed and the unsigned APK). Signer SHA-256: \`$fp\` - must equal the pin in README.md, on andashi.org and in andashi/provisioning's apks/certs/org.andashi.updater.cert."
          # Idempotent: a re-run of this workflow updates the same release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release/updater-"$TAG".apk release/updater-unsigned.apk release/SHA256SUMS release/certs.txt release/toolchain.txt
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$notes" \
              release/updater-"$TAG".apk release/updater-unsigned.apk release/SHA256SUMS release/certs.txt release/toolchain.txt
          fi
