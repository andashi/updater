name: verify

# What CI can prove without a device: that every module compiles, the
# pure-Kotlin decisions with their refusal cases once core/ exists, and the
# shell-side tests. The emulator e2e in e2e/ never runs here (AGENTS.md
# "Tests").
#
# JDK 21 is pinned although the owner's machine runs 26: core/ compiles to
# bytecode 21 either way, and a release build (design §12) must not depend
# on which JDK happened to be around.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: commit-msg hook test
        run: tests/commit-msg.test.sh

  gradle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: core tests and every module's debug build
        run: ./gradlew --no-daemon :core:build :probe:assembleDebug :app:assembleDebug
      - name: unsigned release build
        # Buildability only; the artifact the owner compares against before
        # signing is published by release.yml (decision 0003).
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: core test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore
